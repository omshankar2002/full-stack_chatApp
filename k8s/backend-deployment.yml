
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: chat-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: chatapp-backend
          image: omshankar2002/chatapp-backend:latest

          ports:
            - containerPort: 5001

          env:
            - name: NODE_ENV
              value: "production"

            - name: PORT
              value: "5001"

            - name: MONGODB_URI
              value: "mongodb://mongoadmin:secret@mongodb-service:27017/chat-app?authSource=admin"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chatapp-secret
                  key: password